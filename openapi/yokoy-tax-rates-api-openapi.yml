                    id: 06x2u4nagAMEq3gGMoch
                    name: Standard rate - CA 2025
                    rate: 15
                    statusActive: true
                    type: standard
                    validityEndDate: Wed, 01 Jan 2025 00:00:00 GMT
                    validityStartDate: Wed, 01 Jan 2020 00:00:00 GMT

        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                AdvancedTaxRate:
                  value:
                    accountReference: 6300
                    code: tax01
                    components:
                    - assessmentType: sellerAssessed
                      expenseAccount: GST-5
                      inputAccount: GST-5 IN
                      name: GST
                      outputAccount: GST-5 OUT
                      rate: 5
                      recoverablePercentage: 0
                    - assessmentType: sellerAssessed
                      inputAccount: QST-9 IN

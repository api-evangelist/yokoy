                  - assessmentType: sellerAssessed
                    inputAccount: QST-9 IN
                    name: QST
                    outputAccount: QST-9 OUT
                    rate: 10
                    recoverablePercentage: 0
                  country: CA
                  customInformation: null
                  expenseAccount: QST-9
                  externalId: Tax1
                  id: 06x2u4nagAMEq3gGMoch
                  name: Standard rate - CA 2025
                  rate: 15
                  statusActive: true
                  type: standard

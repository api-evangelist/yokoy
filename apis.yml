- aid: yokoy:yokoy-policy-api
  name: Yokoy Policy API
  description: >-
    An employee policy determines the settings made available to a group of employees. A policy determines:

    - **categories**: the categories available to users to select.

    - **tags**: tags applicable to those users

    - **expense rules**: the expense rules used to calculate expenses for those users.

    - **per diems**: applicable rules per diems at a global level, irrespective of whether the conditions
    are met for applicability.

    - **mileage*: applicable rates at a global level, irrespective of the employee’s mileage counter or
    border crossings.


    You can use the API to set the categories available to users who have been assigned the policy. To
    set tags, expense rules, per diems and mileage rates, use the Yokoy UI.

- aid: yokoy:yokoy-finance-export-api
  name: Yokoy Finance export API
  description: >-
    Finance export mechanism in Yokoy. The Yokoy API exposes three different endpoints for the management
    of finance exports:

    1. `/export-tasks` to trigger an export (separate endpoints for the expense and the invoice module).

    This action is equivalent to clicking the "Export" button under Finance > Export within the Yokoy
    application.

    As a result of a successful export, the expenses/invoices are set to the exported state.

    2. `/export-tasks/{exportTaskId}` to poll the details (in particular the status) of the asynchronous
    export job.

    3. `/export-tasks/{exportTaskId}/artefacts` to fetch the artefacts for those export facilities that
    support this functionality.


    To generate the standard Yokoy export artefacts, the export facility "Yokoy Standard Export (API)"
    must be selected in Yokoy (Admin > Integrations).

    The data model of the standard export artefacts (ExpenseExportArtefact and InvoiceExportArtefact)
    is described in the <a href="https://api.yokoy.ai/v1/swagger.json">following OpenAPI specification</a>.
  humanURL: https://developer.yokoy.ai/api-reference/
  baseURL: https://api.yokoy.ai/v1/organizations/{organizationId}

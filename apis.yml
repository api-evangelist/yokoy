aid: yokoy
name: Yokoy
description: >-
  Yokoy (now part of Perk / TravelPerk) is an AI-powered spend-management
  platform for expenses, supplier invoices and corporate cards. Its public
  REST API (OpenAPI 3.0, 105 operations) imports master and configuration data
  into Yokoy and exports financial data — expenses, trips, invoices,
  transactions, journal entries and FX rates — to third-party ERP and
  accounting systems. Authentication uses the OAuth2 client-credentials flow;
  every request is scoped to an organization ID and most resources to a legal
  entity (company). The API spans expenses, invoices, trips, transactions,
  company cards and card accounts, cost centers, categories, tax rates,
  suppliers, users, policies, tags and finance-export tasks.

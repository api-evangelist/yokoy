- aid: yokoy:yokoy-supplier-api
  name: Yokoy Supplier API
  description: >-
    Companies that supply your company with goods, services, items. The Supplier entity contains information
    on the name, address, and bank accounts of the supplier.

    Suppliers can be set up for different legal entities with default settings at each legal entity level.

    Suppliers must first be created for the organization at `/suppliers` with their basic definition such
    as name, address, tax number and bank accounts.

    Then they can be created legal entity-level at `/legal-entities/{entityId}/suppliers` with the organization
    supplier ID in `supplierId`. Without creating a legal entity supplier, the supplier does not appear
    in Yokoy (in **Invoice processor > Suppliers**).

    Legal entity suppliers can be updated/created just for certain applicable fields.

    To add (POST) or update (PATCH or PUT) a complete legal entity supplier record (e.g. the name of the
    supplier, contact or banking information), you need to add or update the organization supplier first.
    These changes are automatically progpaged to the legal entity suppliers (i.e. the same supplier may
    supply several legal entities) linked to that organization supplier. Then in a subsequent call to
    the legal entity supplier endpoint, you can update the legal entity supplier.


    **NOTE**: When the `Enable InternalSupplierID` setting is active at organization level, the `internalSupplierId`
    attribute is mandatory to point the right supplier.

    It must use the following pattern: `externalId` of the organization supplier + '_' + Yokoy ID of the
    legal entity.
  humanURL: https://developer.yokoy.ai/api-reference/
  baseURL: https://api.yokoy.ai/v1/organizations/{organizationId}
  tags:
  - Supplier
  properties:
